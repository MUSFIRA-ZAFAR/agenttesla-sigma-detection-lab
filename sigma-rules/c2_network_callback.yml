title: Outbound Connection to AgentTesla C2 IP on SMTP Submission Port
status: experimental
description: >
  Detects a network connection to the known AgentTesla C2 IP on port 587,
  the SMTP submission port this malware abuses to exfiltrate stolen data
  disguised as normal outbound email traffic.
author: <your name>
date: 2026-09-18
tags:
  - attack.command-and-control
  - attack.t1071.003
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationIp: '34.41.139.193'
    DestinationPort: 587
  condition: selection
falsepositives:
  - Rare - only relevant if this exact IP is not a legitimate mail relay
    your organization uses
level: high
