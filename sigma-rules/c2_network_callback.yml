title: Network Connection to Known AgentTesla C2 Domain (godforeu.com)
id: 8f1a4b2c-77aa-4b11-9d21-a5c3f9e10002
status: experimental
description: >
  Detects DNS resolution or outbound connection to godforeu.com, a domain
  confirmed as an AgentTesla command-and-control server used for SMTP-based
  data exfiltration. Observed during sandbox analysis (ANY.RUN task,
  SHA256: 708e198608b5b463224c3fb77fcf708b845d0c7b5dbc6e9cab9e185c489be089).
references:
  - https://app.any.run/tasks/  # paste your exact task URL here
author: <your name>
date: 2026-09-18
tags:
  - attack.command-and-control
  - attack.exfiltration
  - attack.t1071.003
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|contains: 'godforeu.com'
  condition: selection
falsepositives:
  - None expected - this is a dedicated malicious domain
level: critical
