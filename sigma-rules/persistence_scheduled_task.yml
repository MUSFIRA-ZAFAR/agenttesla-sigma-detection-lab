title: Suspicious Scheduled Task Creation by Temp-Executed Process - AgentTesla Pattern
id: 8f1a4b2c-77aa-4b11-9d21-a5c3f9e10001
status: experimental
description: >
  Detects creation of a scheduled task via schtasks.exe where the parent
  process is executing from a Temp or AppData directory, and the task is
  created under a folder disguised as a legitimate name (e.g. "Updates")
  with a randomized task name. Observed during sandbox analysis of an
  AgentTesla sample (ANY.RUN task, SHA256: 708e198608b5b463224c3fb77fcf708b845d0c7b5dbc6e9cab9e185c489be089).
references:
  - https://app.any.run/tasks/  # paste your exact task URL here
author: <your name>
date: 2026-09-18
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/Create'
  selection_parent_temp:
    ParentImage|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
  condition: selection_schtasks and selection_parent_temp
falsepositives:
  - Legitimate software installers occasionally create scheduled tasks from
    temp-extracted installers (verify task name and target binary)
level: high
